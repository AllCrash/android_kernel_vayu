# .github/workflows/build-vayu.yml
# Poco X3 Pro (vayu) 4.14 kernel: keep existing KSU-Next + SuSFS, add v4l2loopback
# Works for AOSP A13+ and MIUI A13 (same kernel; flash dtbo.img only on MIUI/HyperOS).
name: Build vayu kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "defconfig name in arch/arm64/configs (verify in your tree!)"
        default: "vayu_defconfig"
        required: true
      v4l2loopback_ref:
        description: "v4l2loopback git tag/branch (pin a release)"
        default: "v0.13.1"
        required: true

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: ci
  KBUILD_BUILD_HOST: github

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential ca-certificates \
            curl git zip unzip rsync python3 cpio kmod libssl-dev \
            libelf-dev wget device-tree-compiler

      - name: Fetch toolchains (Neutron clang + GNU binutils for CROSS_COMPILE)
        run: |
          mkdir -p toolchain/clang
          cd toolchain/clang
          # Neutron clang via antman (pulls the latest stable build)
          curl -LSs "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S
          ./antman --patch=glibc || true
          cd "$GITHUB_WORKSPACE"
          # GNU toolchains only for the assembler bits 4.14 still needs.
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git toolchain/gcc64
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git   toolchain/gcc32

      - name: Add v4l2loopback (KSU-Next/SuSFS left untouched)
        env:
          V4L2_REF: ${{ github.event.inputs.v4l2loopback_ref }}
          DEFCONFIG: ${{ github.event.inputs.defconfig }}
        run: bash integrate.sh

      - name: Build
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig }}
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          MAKE_ARGS="
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1 LLVM_IAS=1
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain/gcc64/bin/aarch64-elf-
            CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain/gcc32/bin/arm-eabi-
          "
          make $MAKE_ARGS "$DEFCONFIG"
          make $MAKE_ARGS -j"$(nproc --all)" 2>&1 | tee build.log
          echo "---- artifacts ----"
          ls -lh out/arch/arm64/boot/ || true

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          # Minimal anykernel.sh tweaks for vayu (edit device.name / block path if needed)
          IMG=out/arch/arm64/boot/Image.gz-dtb
          [ -f "$IMG" ] || IMG=out/arch/arm64/boot/Image-dtb
          cp "$IMG" ak3/ || true
          # dtbo (only needed for MIUI/HyperOS flashing)
          if [ -f out/arch/arm64/boot/dtbo.img ]; then cp out/arch/arm64/boot/dtbo.img ak3/; fi
          cd ak3 && zip -r9 ../vayu-kernel.zip . -x ".git/*"
          cd "$GITHUB_WORKSPACE"
          # collect the v4l2loopback module for the on-device KSU module
          KO=$(find out -name v4l2loopback.ko | head -n1 || true)
          [ -n "$KO" ] && cp "$KO" v4l2loopback.ko || echo "WARN: v4l2loopback.ko not found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vayu-kernel
          path: |
            vayu-kernel.zip
            v4l2loopback.ko
            out/arch/arm64/boot/dtbo.img
            build.log
          if-no-files-found: warn
